[project]
name = "nonce"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "nonce: just-in-time, monitored access to your personal data for AI agents"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "libsql>=0.1.11",
    "mcp>=2.3.0",
    "openai-agents>=0.24.0",
    "pydantic-settings>=2.16.2",
    "pywebpush>=2.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonce"]
